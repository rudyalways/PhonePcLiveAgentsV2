<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sutando Omni</title>
<style>
  :root {
    --ink: #e8e6e1;
    --muted: #9a968c;
    --chip: rgba(12, 14, 18, 0.72);
    --accent: #c4a574;
    --danger: #c45c4a;
    --ok: #4ecca3;
    --info: #60a5fa;
    --warn: #fbbf24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0c0e12;
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  body { overflow: hidden; }
  #stage { position: fixed; inset: 0; background: #111; }
  #cam {
    width: 100%; height: 100%;
    object-fit: cover;
    background: #1a1a1a;
  }
  #cam.mirror { transform: scaleX(-1); }
  #hud {
    position: fixed; left: 0; right: 0; top: 0; z-index: 2;
    padding: calc(10px + env(safe-area-inset-top)) 12px 0;
    pointer-events: none;
  }
  #hud-top {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  }
  #brand {
    font-size: 15px; letter-spacing: 0.04em;
    text-shadow: 0 1px 8px rgba(0,0,0,0.7);
  }
  #status {
    pointer-events: auto;
    font-size: 12px; font-family: ui-sans-serif, system-ui, sans-serif;
    background: var(--chip); color: var(--ink);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px; padding: 6px 12px;
    backdrop-filter: blur(8px);
    white-space: nowrap;
  }
  #status.err { color: #ffb4a8; border-color: rgba(196,92,74,0.5); }
  #status.live { color: var(--ok); border-color: rgba(78,204,163,0.45); }
  #status.speak { color: var(--warn); border-color: rgba(251,191,36,0.45); }
  #status.stream { color: var(--info); border-color: rgba(96,165,250,0.45); }
  #chips {
    margin-top: 8px;
    display: none; flex-wrap: wrap; gap: 6px;
    pointer-events: none;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  .chip {
    font-size: 11px; padding: 4px 9px; border-radius: 999px;
    background: var(--chip); border: 1px solid rgba(255,255,255,0.12);
    color: var(--muted); backdrop-filter: blur(8px);
  }
  .chip.on { color: var(--ok); border-color: rgba(78,204,163,0.4); }
  .chip.hot { color: var(--warn); border-color: rgba(251,191,36,0.45); }
  .chip.busy { color: var(--info); border-color: rgba(96,165,250,0.45); }
  .chip.bad { color: #ffb4a8; border-color: rgba(196,92,74,0.45); }
  #partial {
    margin-top: 8px; display: none;
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px;
    background: rgba(12,14,18,0.7); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; padding: 8px 10px; max-width: 92vw;
    text-shadow: 0 1px 6px rgba(0,0,0,0.8);
  }
  #partial .label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; }
  #partial .text { margin-top: 2px; color: #cde7ff; }
  #login {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 24px 20px calc(28px + env(safe-area-inset-bottom));
    background:
      linear-gradient(180deg, rgba(12,14,18,0.15) 0%, rgba(12,14,18,0.88) 55%, #0c0e12 100%);
  }
  #login h1 {
    font-size: clamp(2.4rem, 10vw, 3.4rem);
    font-weight: 500; line-height: 0.95;
    margin-bottom: 8px;
  }
  #login p { color: var(--muted); font-size: 15px; margin-bottom: 18px; max-width: 20em; }
  #login input {
    width: 100%; margin-bottom: 10px; padding: 14px 16px;
    border-radius: 12px; border: 1px solid rgba(255,255,255,0.14);
    background: rgba(20,22,28,0.9); color: var(--ink); font-size: 16px;
  }
  #login button, #bar button {
    border: none; border-radius: 12px; font-size: 16px; font-weight: 600;
    padding: 14px 18px; cursor: pointer;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  #connect-btn { width: 100%; background: var(--accent); color: #1a140c; }
  #login-error { color: #ffb4a8; font-size: 13px; min-height: 1.2em; margin-top: 8px; }
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
    display: none; gap: 8px; justify-content: center; flex-wrap: wrap;
    padding: 12px 12px calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, transparent, rgba(0,0,0,0.75));
  }
  #bar button { background: rgba(255,255,255,0.12); color: var(--ink); min-width: 72px; }
  #bar button.on { background: var(--accent); color: #1a140c; }
  #bar button.danger { background: var(--danger); color: #fff; }
  #tasks {
    position: fixed; left: 10px; right: 10px; bottom: calc(92px + 34vh + 8px); z-index: 2;
    display: none;
    font-family: ui-sans-serif, system-ui, sans-serif;
    background: rgba(10,12,16,0.82);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    backdrop-filter: blur(10px);
    max-height: 28vh;
    overflow: hidden;
    pointer-events: auto;
  }
  #tasks.short { bottom: calc(92px + 48px + 8px); }
  #tasks-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px; font-size: 12px; color: var(--muted);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  #tasks-header button {
    background: transparent; border: 1px solid rgba(255,255,255,0.15);
    color: var(--muted); border-radius: 6px; font-size: 11px; padding: 2px 8px;
  }
  #tasks-body { max-height: 22vh; overflow: auto; padding: 6px 8px 8px; }
  #tasks-body:empty::after {
    content: "No tasks yet";
    display: block; padding: 8px 4px; color: #666; font-size: 12px;
  }
  .task-card {
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 8px 9px; margin-top: 6px;
    background: rgba(255,255,255,0.03);
    /* Stable footprint so heartbeats don't reflow the list */
    min-height: 74px;
  }
  .task-card:first-child { margin-top: 0; }
  .task-card.done { opacity: 0.65; }
  .task-card.fail { border-color: rgba(196,92,74,0.45); }
  .task-card .task-meta {
    display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center;
    font-size: 10px; color: #8b8680; font-variant-numeric: tabular-nums;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    margin-bottom: 4px; min-height: 14px;
  }
  .task-card .task-meta .seq { color: var(--accent); font-weight: 600; }
  .task-card .task-meta .turn { color: #93c5fd; }
  .task-card .task-meta .wait { color: var(--info); margin-left: auto; }
  .task-card .task-title {
    font-size: 12px; color: #e8e6e1; line-height: 1.35;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    overflow: hidden; min-height: 2.7em;
  }
  .task-steps {
    display: flex; flex-wrap: nowrap; gap: 4px; margin-top: 7px;
    overflow-x: auto; scrollbar-width: none;
  }
  .task-steps::-webkit-scrollbar { display: none; }
  .task-step {
    flex: 0 0 auto;
    font-size: 9px; letter-spacing: 0.01em;
    padding: 2px 6px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.1);
    color: #666; background: rgba(0,0,0,0.25);
  }
  .task-step.done {
    color: var(--ok); border-color: rgba(78,204,163,0.4); background: rgba(78,204,163,0.1);
  }
  .task-step.current {
    color: var(--info); border-color: rgba(96,165,250,0.5); background: rgba(96,165,250,0.12);
  }
  .task-step.fail {
    color: #ffb4a8; border-color: rgba(196,92,74,0.5); background: rgba(196,92,74,0.12);
  }
  .task-preview {
    margin-top: 5px; font-size: 11px; color: #b8ffd2;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    min-height: 1.2em;
  }
  #activity {
    position: fixed; left: 10px; right: 10px; bottom: 92px; z-index: 2;
    display: none;
    font-family: ui-sans-serif, system-ui, sans-serif;
    background: rgba(10,12,16,0.78);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    backdrop-filter: blur(10px);
    max-height: 34vh;
    overflow: hidden;
  }
  #activity-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px; font-size: 12px; color: var(--muted);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    cursor: pointer; pointer-events: auto;
  }
  #activity-header button {
    pointer-events: auto;
    background: transparent; border: 1px solid rgba(255,255,255,0.15);
    color: var(--muted); border-radius: 6px; font-size: 11px; padding: 2px 8px;
  }
  #activity-body { max-height: 28vh; overflow: auto; padding: 6px 10px 10px; }
  #activity-body.collapsed { display: none; }
  .act {
    font-size: 12px; line-height: 1.35; margin-top: 5px;
    color: #cfcabe; text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }
  .act .t { color: #666; margin-right: 6px; font-variant-numeric: tabular-nums; }
  .act.vad { color: var(--warn); }
  .act.asr { color: #cde7ff; }
  .act.stream { color: var(--info); }
  .act.trigger { color: #ffe6b8; }
  .act.error { color: #ffb4a8; }
  .act.user { color: #cde7ff; }
  .act.assistant { color: #ffe6b8; }
  .act.system, .act.session { color: #b8ffd2; }
  .act.work { color: #86efac; }
  .act.core { color: #a5b4fc; }
  #chip-core.bad { border-color: var(--danger); color: #ffb4a8; }
  #core-btn { display: none; }
  #core-btn.show { display: inline-block; }
  #core-btn.stop { background: var(--danger); color: #fff; }
  canvas { display: none; }
</style>
</head>
<body>
<div id="stage">
  <video id="cam" playsinline autoplay muted></video>
</div>
<div id="hud">
  <div id="hud-top">
    <div id="brand">Sutando Omni</div>
    <div id="status">idle</div>
  </div>
  <div id="chips">
    <span class="chip" id="chip-voice">Voice: off</span>
    <span class="chip" id="chip-vad">VAD: —</span>
    <span class="chip" id="chip-asr">ASR: —</span>
    <span class="chip" id="chip-stream">Stream: idle</span>
    <span class="chip" id="chip-trigger">Trigger: —</span>
    <span class="chip" id="chip-work">Work: —</span>
    <span class="chip" id="chip-core">Core: —</span>
  </div>
  <div id="partial">
    <div class="label" id="partial-label">live</div>
    <div class="text" id="partial-text"></div>
  </div>
</div>
<div id="login">
  <h1>Omni</h1>
  <p>Camera-first guide. Voice when you speak; scene changes can prompt quietly.</p>
  <input id="user" type="text" placeholder="Username" autocomplete="username" />
  <input id="secret" type="password" placeholder="Password" autocomplete="current-password" />
  <button id="connect-btn" type="button">Start camera &amp; connect</button>
  <div id="login-error"></div>
</div>
<div id="tasks">
  <div id="tasks-header">
    <span id="tasks-title">Tasks · 0</span>
    <span>
      <button type="button" id="tasks-clear">Clear done</button>
    </span>
  </div>
  <div id="tasks-body"></div>
</div>
<div id="activity">
  <div id="activity-header">
    <span>Activity · transcripts · triggers</span>
    <span>
      <button type="button" id="act-clear">Clear</button>
    </span>
  </div>
  <div id="activity-body"></div>
</div>
<div id="bar">
  <button type="button" id="audio-unlock">Enable sound</button>
  <button type="button" id="mic-btn" class="on">Mic on</button>
  <button type="button" id="flip-btn">Flip</button>
  <button type="button" id="ask-btn">Ask view</button>
  <button type="button" id="work-btn">Task…</button>
  <button type="button" id="core-btn">Start core</button>
  <button type="button" id="disc-btn" class="danger">End</button>
</div>
<canvas id="snap"></canvas>

<script type="module">
const statusEl = document.getElementById("status");
const actBody = document.getElementById("activity-body");
const activity = document.getElementById("activity");
const chips = document.getElementById("chips");
const partialBox = document.getElementById("partial");
const partialLabel = document.getElementById("partial-label");
const partialText = document.getElementById("partial-text");
const cam = document.getElementById("cam");
const canvas = document.getElementById("snap");
const login = document.getElementById("login");
const bar = document.getElementById("bar");
const chipVoice = document.getElementById("chip-voice");
const chipVad = document.getElementById("chip-vad");
const chipAsr = document.getElementById("chip-asr");
const chipStream = document.getElementById("chip-stream");
const chipTrigger = document.getElementById("chip-trigger");
const chipWork = document.getElementById("chip-work");
const chipCore = document.getElementById("chip-core");
const coreBtn = document.getElementById("core-btn");

let ws = null;
let coreAlive = false;
let workStartedAt = 0;
let stream = null;
let audioCtx = null;
let playCtx = null;
let processor = null;
let sourceNode = null;
let micOn = true;
let facing = "environment";
let frameTimer = null;
let playTime = 0;
let sessionModel = "";
let lastAsr = "";

const params = new URLSearchParams(location.search);
if (params.get("user")) document.getElementById("user").value = params.get("user");
if (params.get("secret")) document.getElementById("secret").value = params.get("secret");

function setStatus(t, mode = "") {
  statusEl.textContent = t;
  statusEl.classList.remove("err", "live", "speak", "stream");
  if (mode) statusEl.classList.add(mode);
}
function setChip(el, text, cls = "") {
  el.textContent = text;
  el.className = "chip" + (cls ? " " + cls : "");
}
function showPartial(role, text) {
  if (!text) {
    partialBox.style.display = "none";
    return;
  }
  partialBox.style.display = "block";
  partialLabel.textContent = role === "user" ? "ASR (live)" : "Assistant (streaming)";
  partialText.textContent = text;
}
// One sticky Activity row per in-flight task_id; only the wait seconds update.
const stickyWorkRows = new Map(); // task_id -> HTMLElement

function logAct(kind, message, opts = {}) {
  const d = document.createElement("div");
  d.className = "act " + (kind || "");
  const ts = new Date().toLocaleTimeString([], { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
  d.innerHTML = `<span class="t">${ts}</span><span class="m">${escapeHtml(message)}</span>`;
  if (opts.stickyId) {
    d.dataset.taskId = opts.stickyId;
    stickyWorkRows.set(opts.stickyId, d);
  }
  actBody.appendChild(d);
  actBody.scrollTop = actBody.scrollHeight;
  while (actBody.children.length > 80) {
    const first = actBody.firstChild;
    const tid = first && first.dataset ? first.dataset.taskId : "";
    if (tid) stickyWorkRows.delete(tid);
    actBody.removeChild(first);
  }
}

function upsertStickyProcessing(taskId, elapsedMs) {
  if (!taskId) return;
  const fullId = taskId.startsWith("task-") ? taskId : `task-${taskId}`;
  const msg = `Task processing… waited ${fmtMs(elapsedMs)} — ${fullId}`;
  let row = stickyWorkRows.get(fullId);
  if (!row) {
    logAct("work", msg, { stickyId: fullId });
    return;
  }
  const m = row.querySelector(".m");
  if (m) m.textContent = msg;
  // Keep original timestamp; only the message body changes.
}

function clearStickyProcessing(taskId) {
  if (!taskId) return;
  const fullId = taskId.startsWith("task-") ? taskId : `task-${taskId}`;
  const row = stickyWorkRows.get(fullId);
  if (row) {
    row.remove();
    stickyWorkRows.delete(fullId);
  }
}

// Task lifecycle list (tool → file → CC → result → processed)
const TASK_STEPS = [
  { key: "tool", label: "Tool" },
  { key: "written", label: "Task file" },
  { key: "cc", label: "CC run" },
  { key: "cc_done", label: "CC done" },
  { key: "result", label: "Result file" },
  { key: "processed", label: "Processed" },
];
const taskStore = new Map(); // key (task_id|call_id) -> task record
const taskCards = new Map(); // key -> HTMLElement (stable DOM)
let taskSeqCounter = 0;
const tasksEl = document.getElementById("tasks");
const tasksBody = document.getElementById("tasks-body");
const tasksTitle = document.getElementById("tasks-title");

function taskKeyFromMsg(msg) {
  if (msg.task_id) return msg.task_id.startsWith("task-") ? msg.task_id : `task-${msg.task_id}`;
  if (msg.call_id) return `call:${msg.call_id}`;
  return "";
}

function fmtClock(ts) {
  try {
    return new Date(ts).toLocaleTimeString([], { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
  } catch {
    return "--:--:--";
  }
}

function shortTaskId(id) {
  const s = String(id || "");
  if (s.startsWith("task-") && s.length > 10) return "…" + s.slice(-6);
  if (s.startsWith("call:")) return "call…" + s.slice(-6);
  return s.slice(-8) || "?";
}

function ensureTask(key, patch = {}) {
  if (!key) return null;
  let t = taskStore.get(key);
  if (!t) {
    // Merge provisional call:* entry into real task_id when both known.
    if (patch.call_id) {
      const prov = taskStore.get(`call:${patch.call_id}`);
      if (prov && key.startsWith("task-")) {
        taskStore.delete(`call:${patch.call_id}`);
        const oldCard = taskCards.get(`call:${patch.call_id}`);
        if (oldCard) {
          taskCards.delete(`call:${patch.call_id}`);
          taskCards.set(key, oldCard);
          oldCard.dataset.taskKey = key;
        }
        t = prov;
        t.id = key;
      }
    }
  }
  if (!t) {
    taskSeqCounter += 1;
    t = {
      id: key,
      seq: taskSeqCounter,
      call_id: patch.call_id || "",
      turn_id: patch.turn_id || "",
      task: "",
      step: -1, // index into TASK_STEPS
      failed: false,
      preview: "",
      startedAt: Date.now(),
      elapsedMs: 0,
      updatedAt: Date.now(),
    };
  }
  const prevStep = t.step;
  const prevFailed = t.failed;
  Object.assign(t, patch);
  t.updatedAt = Date.now();
  if (patch.elapsed_ms != null) t.elapsedMs = patch.elapsed_ms;
  if (patch.turn_id) t.turn_id = patch.turn_id;
  taskStore.set(t.id, t);
  t._stepChanged = t.step !== prevStep || t.failed !== prevFailed;
  return t;
}

function advanceTask(t, stepIndex) {
  if (!t || t.failed) return;
  if (stepIndex > t.step) t.step = stepIndex;
}

function applyWorkLifecycle(msg) {
  const key = taskKeyFromMsg(msg);
  const state = msg.state || "";
  const patch = {
    call_id: msg.call_id || "",
    turn_id: msg.turn_id || undefined,
    task: msg.task || undefined,
    elapsed_ms: msg.elapsed_ms,
    preview: msg.preview || undefined,
  };
  // Drop undefined so Object.assign doesn't wipe fields.
  Object.keys(patch).forEach((k) => patch[k] === undefined && delete patch[k]);

  let t = ensureTask(key || `anon:${Date.now()}`, patch);
  if (!t) return;

  const stepBefore = t.step;
  if (state === "tool_called") {
    advanceTask(t, 0);
    if (msg.arguments || msg.parameters) {
      const params = msg.arguments || JSON.stringify(msg.parameters);
      try {
        const p = typeof params === "string" ? JSON.parse(params) : params;
        if (p && p.task) t.task = String(p.task);
      } catch {
        if (!t.task && typeof params === "string") t.task = params.slice(0, 80);
      }
    }
    t.tool = msg.tool || "work";
  } else if (state === "task_written" || state === "queued") {
    advanceTask(t, 1);
  } else if (state === "waiting" || state === "processing") {
    // Heartbeat: keep timer; honor phase if server says CC claimed the file.
    if (msg.phase === "cc_processing") advanceTask(t, 2);
    else if (t.step < 1) advanceTask(t, 1);
  } else if (state === "cc_processing") {
    advanceTask(t, 2);
  } else if (state === "cc_done") {
    advanceTask(t, 3);
  } else if (state === "result_file") {
    advanceTask(t, 3);
    advanceTask(t, 4);
  } else if (state === "result") {
    advanceTask(t, 4);
  } else if (state === "result_processed" || state === "speak_queued" || state === "speak_started") {
    if (state === "result_processed") advanceTask(t, 5);
  } else if (state === "timeout") {
    t.failed = true;
    if (t.step < 1) advanceTask(t, 1);
  }
  // Heartbeat-only updates: patch wait label in place (no list reshuffle).
  const heartbeatOnly = (state === "waiting" || state === "processing") && t.step === stepBefore;
  if (heartbeatOnly) {
    patchTaskWait(t);
    return;
  }
  renderTasks();
}

function stepsHtmlFor(t) {
  const done = !t.failed && t.step >= 5;
  let stepsHtml = "";
  for (let i = 0; i < TASK_STEPS.length; i++) {
    let cls = "task-step";
    if (t.failed && i === Math.max(t.step, 0)) cls += " fail";
    else if (i < t.step) cls += " done";
    else if (i === t.step && !done) cls += t.failed ? " fail" : " current";
    else if (done) cls += " done";
    stepsHtml += `<span class="${cls}">${TASK_STEPS[i].label}</span>`;
  }
  return stepsHtml;
}

function metaHtmlFor(t) {
  const wait = t.elapsedMs ? fmtMs(t.elapsedMs) : fmtMs(Date.now() - t.startedAt);
  const turn = t.turn_id ? String(t.turn_id).split("/")[0] : "—";
  return (
    `<span class="seq">#${t.seq || "?"}</span>` +
    `<span class="turn">${escapeHtml(turn)}</span>` +
    `<span class="clock">${escapeHtml(fmtClock(t.startedAt))}</span>` +
    `<span class="tid">${escapeHtml(shortTaskId(t.id))}</span>` +
    `<span class="wait">${escapeHtml(wait)}</span>`
  );
}

function patchTaskWait(t) {
  const card = taskCards.get(t.id);
  if (!card) {
    renderTasks();
    return;
  }
  const waitEl = card.querySelector(".wait");
  if (waitEl) {
    waitEl.textContent = t.elapsedMs ? fmtMs(t.elapsedMs) : fmtMs(Date.now() - t.startedAt);
  }
}

function renderTasks() {
  // Stable order: open tasks by creation seq, then finished/failed by seq.
  const items = Array.from(taskStore.values()).sort((a, b) => {
    const aOpen = !a.failed && a.step < 5 ? 0 : 1;
    const bOpen = !b.failed && b.step < 5 ? 0 : 1;
    if (aOpen !== bOpen) return aOpen - bOpen;
    return (a.seq || 0) - (b.seq || 0);
  });
  const open = items.filter((t) => !t.failed && t.step < 5).length;
  tasksTitle.textContent = `Tasks · ${open} open / ${items.length}`;

  const keep = new Set();
  const frag = document.createDocumentFragment();
  for (const t of items.slice(0, 16)) {
    keep.add(t.id);
    const done = !t.failed && t.step >= 5;
    let card = taskCards.get(t.id);
    if (!card) {
      card = document.createElement("div");
      card.dataset.taskKey = t.id;
      taskCards.set(t.id, card);
    }
    card.className = "task-card" + (done ? " done" : "") + (t.failed ? " fail" : "");
    const title = t.task || t.tool || shortTaskId(t.id) || "task";
    const preview = t.failed ? "timeout / failed" : (t.preview || "");
    card.innerHTML =
      `<div class="task-meta">${metaHtmlFor(t)}</div>` +
      `<div class="task-title">${escapeHtml(title)}</div>` +
      `<div class="task-steps">${stepsHtmlFor(t)}</div>` +
      `<div class="task-preview"${t.failed ? ' style="color:#ffb4a8"' : ""}>${escapeHtml(preview)}</div>`;
    frag.appendChild(card);
  }
  // Drop cards no longer shown / cleared.
  for (const [k, el] of Array.from(taskCards.entries())) {
    if (!keep.has(k)) {
      el.remove();
      taskCards.delete(k);
    }
  }
  tasksBody.replaceChildren(frag);
}

function clearDoneTasks() {
  for (const [k, t] of Array.from(taskStore.entries())) {
    if (t.failed || t.step >= 5) {
      taskStore.delete(k);
      const card = taskCards.get(k);
      if (card) {
        card.remove();
        taskCards.delete(k);
      }
    }
  }
  renderTasks();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function wsUrl() {
  const u = new URL(location.href);
  u.protocol = u.protocol === "https:" ? "wss:" : "ws:";
  u.pathname = "/ws";
  u.search = "";
  u.hash = "";
  return u.toString();
}

function downsampleTo16k(float32, inRate) {
  if (inRate === 16000) {
    const out = new Int16Array(float32.length);
    for (let i = 0; i < float32.length; i++) {
      const s = Math.max(-1, Math.min(1, float32[i]));
      out[i] = (s * 0x7fff) | 0;
    }
    return out;
  }
  const ratio = inRate / 16000;
  const newLen = Math.floor(float32.length / ratio);
  const out = new Int16Array(newLen);
  for (let i = 0; i < newLen; i++) {
    const s = Math.max(-1, Math.min(1, float32[Math.floor(i * ratio)] || 0));
    out[i] = (s * 0x7fff) | 0;
  }
  return out;
}

function b64FromInt16(int16) {
  const bytes = new Uint8Array(int16.buffer, int16.byteOffset, int16.byteLength);
  let bin = "";
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    bin += String.fromCharCode(...bytes.subarray(i, i + chunk));
  }
  return btoa(bin);
}

async function ensurePlayCtx() {
  if (!playCtx) playCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
  if (playCtx.state === "suspended") await playCtx.resume();
  playTime = Math.max(playTime, playCtx.currentTime);
}

function playPcm24kBase64(b64) {
  if (!playCtx) return;
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const samples = new Int16Array(bytes.buffer, bytes.byteOffset, bytes.byteLength / 2);
  const f32 = new Float32Array(samples.length);
  for (let i = 0; i < samples.length; i++) f32[i] = samples[i] / 0x8000;
  const buf = playCtx.createBuffer(1, f32.length, 24000);
  buf.copyToChannel(f32, 0);
  const src = playCtx.createBufferSource();
  src.buffer = buf;
  src.connect(playCtx.destination);
  const startAt = Math.max(playCtx.currentTime + 0.01, playTime);
  src.start(startAt);
  playTime = startAt + buf.duration;
}

async function startMedia() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true },
    video: {
      facingMode: { ideal: facing },
      width: { ideal: 1280 },
      height: { ideal: 720 },
    },
  });
  cam.srcObject = stream;
  cam.classList.toggle("mirror", facing === "user");
  await cam.play().catch(() => {});

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  sourceNode = audioCtx.createMediaStreamSource(stream);
  processor = audioCtx.createScriptProcessor(4096, 1, 1);
  processor.onaudioprocess = (e) => {
    if (!micOn || !ws || ws.readyState !== 1) return;
    const input = e.inputBuffer.getChannelData(0);
    const pcm = downsampleTo16k(input, audioCtx.sampleRate);
    ws.send(JSON.stringify({ type: "audio", format: "pcm16le_16k", data: b64FromInt16(pcm) }));
  };
  const gain = audioCtx.createGain();
  gain.gain.value = 0;
  sourceNode.connect(processor);
  processor.connect(gain);
  gain.connect(audioCtx.destination);

  if (frameTimer) clearInterval(frameTimer);
  frameTimer = setInterval(sendFrame, 1000);
  setChip(chipVoice, micOn ? "Mic: on" : "Mic: off", micOn ? "on" : "");
}

function sendFrame() {
  if (!ws || ws.readyState !== 1 || !cam.videoWidth) return;
  const w = 640;
  const h = Math.round((cam.videoHeight / cam.videoWidth) * w) || 360;
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(cam, 0, 0, w, h);
  canvas.toBlob(async (blob) => {
    if (!blob || !ws || ws.readyState !== 1) return;
    const buf = await blob.arrayBuffer();
    const bytes = new Uint8Array(buf);
    let bin = "";
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    ws.send(JSON.stringify({ type: "image", mime: "image/jpeg", data: btoa(bin) }));
  }, "image/jpeg", 0.7);
}

function resetLiveUi() {
  setChip(chipVad, "VAD: —");
  setChip(chipAsr, "ASR: —");
  setChip(chipStream, "Stream: idle");
  setChip(chipTrigger, "Trigger: —");
  setChip(chipWork, "Work: —");
  setChip(chipCore, "Core: —");
  coreBtn.classList.remove("show", "stop");
  coreBtn.textContent = "Start core";
  workStartedAt = 0;
  showPartial("", "");
  lastAsr = "";
  taskStore.clear();
  for (const el of taskCards.values()) el.remove();
  taskCards.clear();
  taskSeqCounter = 0;
  renderTasks();
}

function setCoreStatus(msg) {
  coreAlive = !!msg.alive;
  const age = msg.age_s == null ? "?" : (msg.age_s < 120 ? msg.age_s + "s" : Math.round(msg.age_s / 60) + "m");
  const pend = msg.pending_tasks != null ? ` · ${msg.pending_tasks} queued` : "";
  if (msg.alive) {
    setChip(chipCore, `Core: up ${age}${pend}`, "on");
    if (msg.can_stop !== false) {
      coreBtn.textContent = "Stop core";
      coreBtn.classList.add("show", "stop");
    } else {
      coreBtn.classList.remove("show", "stop");
    }
  } else {
    setChip(chipCore, `Core: DOWN (${age})${pend}`, "bad");
    if (msg.can_start !== false) {
      coreBtn.textContent = "Start core";
      coreBtn.classList.add("show");
      coreBtn.classList.remove("stop");
    } else {
      coreBtn.classList.remove("show", "stop");
    }
  }
  chipCore.title = msg.how ? `Start: ${msg.how}` : "";
}

function fmtMs(ms) {
  if (ms == null || ms < 0) return "?";
  if (ms < 1000) return ms + "ms";
  const s = ms / 1000;
  if (s < 60) return s.toFixed(1) + "s";
  const m = Math.floor(s / 60);
  return m + "m" + String(Math.floor(s % 60)).padStart(2, "0") + "s";
}

function stopAll() {
  if (frameTimer) clearInterval(frameTimer);
  frameTimer = null;
  try { processor && processor.disconnect(); } catch {}
  try { sourceNode && sourceNode.disconnect(); } catch {}
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  if (ws) { try { ws.close(); } catch {} }
  ws = null;
  bar.style.display = "none";
  activity.style.display = "none";
  tasksEl.style.display = "none";
  chips.style.display = "none";
  login.style.display = "flex";
  setStatus("idle");
  setChip(chipVoice, "Voice: off");
  resetLiveUi();
}

function handleMsg(msg) {
  if (msg.type === "session.ready") {
    login.style.display = "none";
    bar.style.display = "flex";
    activity.style.display = "block";
    tasksEl.style.display = "block";
    chips.style.display = "flex";
    sessionModel = msg.model || "qwen";
    setStatus("listening", "live");
    setChip(chipVoice, "Voice: live", "on");
    resetLiveUi();
    const tools = Array.isArray(msg.tools) ? msg.tools.join(",") : "";
    logAct("session", `Connected · ${sessionModel}` + (msg.scene_change ? " · scene_change on" : "") + (tools ? ` · tools=[${tools}]` : ""));
  } else if (msg.type === "status") {
    const st = msg.state || "";
    if (st === "user_speaking") setStatus("user speaking", "speak");
    else if (st === "responding" || st === "proactive") setStatus(st, "stream");
    else if (st === "working") setStatus("working", "stream");
    else if (st === "listening") setStatus("listening", "live");
    else setStatus(st);
  } else if (msg.type === "vad") {
    if (msg.state === "speech_started") {
      setChip(chipVad, "VAD: speech", "hot");
      showPartial("user", lastAsr || "…");
    } else {
      setChip(chipVad, "VAD: quiet", "on");
    }
  } else if (msg.type === "stream") {
    const turn = msg.turn_id ? `[${msg.turn_id}] ` : "";
    if (msg.state === "started") setChip(chipStream, `Stream: ${turn || ""}out`.trim(), "busy");
    else if (msg.state === "audio") setChip(chipStream, `Stream: audio×${msg.chunks || 0}`, "busy");
    else if (msg.state === "done") {
      setChip(chipStream, msg.suppressed ? "Stream: suppressed" : "Stream: idle", msg.suppressed ? "hot" : "on");
      showPartial("", "");
    }
  } else if (msg.type === "trigger") {
    const label = `${msg.reason || "?"} · ${msg.state || ""}`;
    setChip(chipTrigger, `Trigger: ${msg.reason || "?"}`, msg.state === "fired" || msg.state === "queued" ? "hot" : "");
    logAct("trigger", `Trigger ${label}` + (msg.why ? ` (${msg.why})` : ""));
  } else if (msg.type === "work") {
    const turn = msg.turn_id ? `[${msg.turn_id}] ` : "";
    const taskId = msg.task_id || "";
    const id = taskId.replace(/^task-/, "…");
    const wait = fmtMs(msg.elapsed_ms);
    applyWorkLifecycle(msg);
    if (msg.state === "tool_called") {
      const tool = msg.tool || "?";
      const params = msg.arguments
        || (msg.parameters ? JSON.stringify(msg.parameters) : "");
      setChip(chipWork, `Work: tool ${tool}`, "hot");
      logAct("work", `${turn}Tool call: ${tool}(${params})`);
    } else if (msg.state === "task_written") {
      workStartedAt = Date.now();
      setChip(chipWork, "Work: task file", "busy");
      logAct("work", `${turn}Task file written${id ? " " + id : ""} · ${msg.task || ""}`);
      upsertStickyProcessing(taskId, msg.elapsed_ms || 0);
    } else if (msg.state === "queued") {
      // Legacy/compat — list already advanced via task_written when present.
      workStartedAt = Date.now();
      setChip(chipWork, "Work: queued", "busy");
      if (!taskId) logAct("work", `${turn}Task queued · ${msg.task || ""}`);
      upsertStickyProcessing(taskId, msg.elapsed_ms || 0);
    } else if (msg.state === "cc_processing") {
      setChip(chipWork, `Work: CC ${wait}`, "busy");
      upsertStickyProcessing(taskId, msg.elapsed_ms || 0);
      logAct("work", `${turn}CC processing${id ? " " + id : ""}`);
    } else if (msg.state === "processing" || msg.state === "waiting") {
      const label = msg.phase === "cc_processing" ? `Work: CC ${wait}` : `Work: wait ${wait}`;
      setChip(chipWork, label, "busy");
      upsertStickyProcessing(taskId, msg.elapsed_ms || 0);
    } else if (msg.state === "cc_done") {
      setChip(chipWork, `Work: CC done ${wait}`, "on");
      logAct("work", `${turn}CC done${id ? " " + id : ""} — ${msg.preview || ""}`);
    } else if (msg.state === "result_file") {
      setChip(chipWork, `Work: result file ${wait}`, "on");
      logAct("work", `${turn}Result file${id ? " " + id : ""} — ${msg.preview || ""}`);
    } else if (msg.state === "result") {
      clearStickyProcessing(taskId);
      setChip(chipWork, `Work: done ${wait}`, "on");
      logAct("work", `Result back after ${wait}${id ? " · " + id : ""} — ${msg.preview || ""}`);
      workStartedAt = 0;
    } else if (msg.state === "result_processed") {
      clearStickyProcessing(taskId);
      setChip(chipWork, `Work: processed ${wait}`, "on");
      const note = msg.skipped ? ` (skipped:${msg.skipped})`
        : msg.queued ? " (speak queued)"
        : msg.spoke === false ? " (not spoken)" : "";
      logAct("work", `${turn}Result processed${id ? " " + id : ""}${note}`);
      workStartedAt = 0;
    } else if (msg.state === "speak_queued") {
      setChip(chipWork, `Work: speak Q${msg.queue_len || "?"}`, "busy");
      logAct("work", `${turn}Speak buffered${id ? " " + id : ""} · q=${msg.queue_len || "?"} (${msg.merge || "serial"})`);
    } else if (msg.state === "speak_started") {
      setChip(chipWork, "Work: speaking", "busy");
      logAct("work", `${turn}Speak started${id ? " " + id : ""}${msg.queue_len ? ` · ${msg.queue_len} left` : ""}`);
    } else if (msg.state === "timeout") {
      clearStickyProcessing(taskId);
      setChip(chipWork, `Work: timeout ${wait}`, "bad");
      logAct("work", `Task timed out after ${wait}${id ? " · " + id : ""}`);
      workStartedAt = 0;
    }
  } else if (msg.type === "core") {
    setCoreStatus(msg);
  } else if (msg.type === "core_start" || msg.type === "core_stop") {
    logAct(msg.ok ? "core" : "error", msg.message || msg.type);
    setCoreStatus(msg);
  } else if (msg.type === "activity") {
    const message = msg.message || "";
    // Ignore legacy server heartbeats if any still arrive.
    if (/^Task processing/.test(message)) {
      const m = message.match(/task-\d+/);
      if (m) {
        const em = message.match(/([\d.]+)s/);
        upsertStickyProcessing(m[0], em ? Number(em[1]) * 1000 : 0);
      }
      return;
    }
    logAct(msg.kind || "system", message);
  } else if (msg.type === "audio.out") {
    playPcm24kBase64(msg.data);
    setChip(chipStream, "Stream: playing", "busy");
  } else if (msg.type === "transcript") {
    const role = msg.role || "assistant";
    const text = msg.text || "";
    if (msg.partial) {
      showPartial(role, text);
      if (role === "user") {
        lastAsr = text;
        setChip(chipAsr, `ASR: ${text.slice(0, 28)}${text.length > 28 ? "…" : ""}`, "busy");
      }
    } else {
      showPartial("", "");
      if (role === "user") {
        lastAsr = text;
        setChip(chipAsr, `ASR: ${text.slice(0, 28)}${text.length > 28 ? "…" : ""}`, "on");
      }
      if (!msg.suppressed) logAct(role, `${role}: ${text}`);
      else logAct("system", "assistant: (no speak)");
    }
  } else if (msg.type === "error") {
    setStatus(msg.message || "error", "err");
    setChip(chipStream, "Stream: error", "bad");
    logAct("error", msg.message || "error");
    const err = document.getElementById("login-error");
    if (login.style.display !== "none") err.textContent = msg.message || "error";
  }
}

document.getElementById("connect-btn").onclick = async () => {
  const user = document.getElementById("user").value.trim() || "default";
  const secret = document.getElementById("secret").value;
  const err = document.getElementById("login-error");
  err.textContent = "";
  try {
    await startMedia();
    await ensurePlayCtx();
    ws = new WebSocket(wsUrl());
    ws.onopen = () => {
      ws.send(JSON.stringify({ type: "session.start", user, auth: secret }));
      setStatus("connecting…");
      logAct("session", "WebSocket open → session.start");
    };
    ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }
      handleMsg(msg);
    };
    ws.onclose = () => {
      setStatus("disconnected", "err");
      setChip(chipVoice, "Voice: off", "bad");
      logAct("error", "WebSocket closed");
    };
    ws.onerror = () => {
      setStatus("socket error", "err");
      logAct("error", "WebSocket error");
    };
  } catch (e) {
    err.textContent = String(e.message || e);
    setStatus("media failed", "err");
  }
};

document.getElementById("audio-unlock").onclick = () => ensurePlayCtx();
document.getElementById("mic-btn").onclick = (e) => {
  micOn = !micOn;
  e.target.textContent = micOn ? "Mic on" : "Mic off";
  e.target.classList.toggle("on", micOn);
  setChip(chipVoice, micOn ? "Mic: on" : "Mic: muted", micOn ? "on" : "hot");
  logAct("system", micOn ? "Mic unmuted" : "Mic muted");
};
document.getElementById("flip-btn").onclick = async () => {
  facing = facing === "environment" ? "user" : "environment";
  await startMedia();
  logAct("system", `Camera facing: ${facing}`);
};
document.getElementById("ask-btn").onclick = () => {
  if (ws?.readyState === 1) {
    ws.send(JSON.stringify({ type: "control", action: "prompt_manual", text: "Describe what you see in the camera right now." }));
    setChip(chipTrigger, "Trigger: manual", "hot");
  }
};
document.getElementById("work-btn").onclick = () => {
  const task = prompt("Task for Sutando core / CC:");
  if (task && ws?.readyState === 1) {
    ws.send(JSON.stringify({ type: "control", action: "work", task }));
  }
};
coreBtn.onclick = () => {
  if (ws?.readyState !== 1) return;
  coreBtn.disabled = true;
  const action = coreAlive ? "stop_core" : "start_core";
  logAct("core", action === "start_core" ? "Starting sutando-core…" : "Stopping sutando-core…");
  ws.send(JSON.stringify({ type: "control", action }));
  setTimeout(() => { coreBtn.disabled = false; }, 5000);
};
document.getElementById("disc-btn").onclick = () => stopAll();
document.getElementById("act-clear").onclick = (e) => {
  e.stopPropagation();
  actBody.innerHTML = "";
  stickyWorkRows.clear();
};
document.getElementById("tasks-clear").onclick = (e) => {
  e.stopPropagation();
  clearDoneTasks();
};
document.getElementById("activity-header").onclick = (e) => {
  if (e.target.tagName === "BUTTON") return;
  actBody.classList.toggle("collapsed");
  tasksEl.classList.toggle("short", actBody.classList.contains("collapsed"));
};
</script>
</body>
</html>
