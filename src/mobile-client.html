<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sutando — Mobile</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0a0a12; color: #c0c0d0;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; min-height: 100dvh;
    padding: 16px; gap: 12px;
  }
  h1 { font-size: 18px; font-weight: 500; color: #e0e0f0; }
  .status {
    font-size: 13px; padding: 6px 14px; border-radius: 16px;
    background: #1a1a2e; border: 1px solid #2a2a4e;
  }
  .status.connected { border-color: #2a6e2a; color: #6fbf6f; }
  .status.error { border-color: #6e2a2a; color: #bf6f6f; }
  button {
    padding: 14px 32px; font-size: 16px; border: none; border-radius: 10px;
    cursor: pointer; font-weight: 600; width: 100%; max-width: 300px;
  }
  #connect-btn { background: #2563eb; color: white; }
  #connect-btn:disabled { background: #333; color: #666; }
  #disconnect-btn { background: #dc2626; color: white; display: none; }
  #mute-btn { background: #444; color: white; display: none; }
  #mute-btn.muted { background: #b91c1c; }
  #screen-view {
    width: 100%; max-width: 100vw; aspect-ratio: 16/9;
    background: #111; border-radius: 8px; border: 1px solid #2a2a4e;
    display: none; object-fit: contain;
  }
  .login-form {
    display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 300px;
  }
  input {
    padding: 12px 14px; font-size: 15px; border-radius: 10px;
    background: #1a1a2e; border: 1px solid #2a2a4e; color: #e0e0f0;
    outline: none; width: 100%;
  }
  input:focus { border-color: #2563eb; }
  #login-error { color: #bf6f6f; font-size: 13px; text-align: center; display: none; }
  #main-ui { display: none; flex-direction: column; align-items: center; width: 100%; gap: 12px; }
</style>
</head>
<body>

<h1>Sutando Mobile</h1>

<div class="login-form" id="login-form">
  <input id="username-input" type="text" placeholder="Username" autocomplete="username" />
  <input id="secret-input" type="password" placeholder="Password" autocomplete="current-password" />
  <button id="connect-btn">Connect</button>
  <div id="login-error"></div>
</div>

<div id="main-ui">
  <div id="status" class="status">Connecting...</div>
  <video id="screen-view" autoplay playsinline></video>
  <div id="participants" class="participants"></div>
  <div class="controls">
    <button id="mute-btn">Mute</button>
    <button id="disconnect-btn">Disconnect</button>
  </div>
</div>

<script type="module">
  import {
    Room,
    RoomEvent,
    Track,
    createLocalTracks,
  } from 'https://esm.sh/livekit-client@2.9.7';

  // Token endpoint: same origin (proxied by screen-publisher-server)
  const TOKEN_SERVER = `${window.location.origin}`;

  const loginForm = document.getElementById('login-form');
  const mainUi = document.getElementById('main-ui');
  const connectBtn = document.getElementById('connect-btn');
  const disconnectBtn = document.getElementById('disconnect-btn');
  const muteBtn = document.getElementById('mute-btn');
  const screenView = document.getElementById('screen-view');
  const participantsEl = document.getElementById('participants');
  const statusEl = document.getElementById('status');
  const loginError = document.getElementById('login-error');
  const usernameInput = document.getElementById('username-input');
  const secretInput = document.getElementById('secret-input');

  let room = null;
  let micTrack = null;
  let muted = false;

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = `status ${cls || ''}`;
  }

  function updateParticipants() {
    if (!room) return;
    const names = [];
    room.remoteParticipants.forEach((p) => names.push(p.identity));
    participantsEl.textContent = names.length
      ? `In room: ${names.join(', ')}`
      : 'Waiting for other participants...';
  }

  async function connect() {
    const username = usernameInput.value.trim();
    const secret = secretInput.value;
    if (!username || !secret) {
      loginError.textContent = 'Enter username and password';
      loginError.style.display = 'block';
      return;
    }

    connectBtn.disabled = true;
    loginError.style.display = 'none';

    try {
      // Unlock Web Audio on iOS — must happen in user-gesture context
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();

      const resp = await fetch(
        `${TOKEN_SERVER}/token?user=${encodeURIComponent(username)}&secret=${encodeURIComponent(secret)}&identity=phone-user&name=Phone`
      );
      if (!resp.ok) {
        const body = await resp.json().catch(() => ({}));
        throw new Error(body.error || `Token error ${resp.status}`);
      }
      const { jwt, url } = await resp.json();
      if (!url) throw new Error('LIVEKIT_URL not configured on server');

      loginForm.style.display = 'none';
      mainUi.style.display = 'flex';
      setStatus('Connecting...', '');

      room = new Room({ adaptiveStream: true, dynacast: true });

      room.on(RoomEvent.TrackSubscribed, (track, pub, participant) => {
        console.log(`[LiveKit] Track subscribed: ${track.kind} from ${participant.identity}`);
        if (track.kind === Track.Kind.Video) {
          track.attach(screenView);
          screenView.style.display = 'block';
        }
        if (track.kind === Track.Kind.Audio) {
          const el = track.attach();
          el.setAttribute('autoplay', '');
          el.setAttribute('playsinline', '');
          el.volume = 1.0;
          document.body.appendChild(el);
          el.play().catch(e => console.warn('[LiveKit] Audio play blocked:', e));
        }
      });

      room.on(RoomEvent.TrackUnsubscribed, (track) => {
        track.detach().forEach((el) => el.remove());
        if (track.kind === Track.Kind.Video) screenView.style.display = 'none';
      });

      room.on(RoomEvent.Connected, () => {
        setStatus('Connected', 'connected');
        disconnectBtn.style.display = 'block';
        muteBtn.style.display = 'block';
        updateParticipants();
      });

      room.on(RoomEvent.Disconnected, () => {
        setStatus('Disconnected', '');
        cleanup();
      });

      room.on(RoomEvent.ParticipantConnected, () => updateParticipants());
      room.on(RoomEvent.ParticipantDisconnected, () => updateParticipants());

      await room.connect(url, jwt);

      const tracks = await createLocalTracks({ audio: true, video: false });
      micTrack = tracks[0];
      await room.localParticipant.publishTrack(micTrack, {
        name: 'mic',
        source: Track.Source.Microphone,
      });
      console.log('[LiveKit] Mic published');

    } catch (err) {
      console.error('Connect failed:', err);
      loginForm.style.display = 'flex';
      mainUi.style.display = 'none';
      loginError.textContent = err.message;
      loginError.style.display = 'block';
      connectBtn.disabled = false;
    }
  }

  function toggleMute() {
    if (!micTrack) return;
    muted = !muted;
    micTrack.mediaStreamTrack.enabled = !muted;
    muteBtn.textContent = muted ? 'Unmute' : 'Mute';
    muteBtn.classList.toggle('muted', muted);
  }

  async function disconnect() {
    if (room) await room.disconnect();
    cleanup();
  }

  function cleanup() {
    if (micTrack) { micTrack.stop(); micTrack = null; }
    room = null;
    muted = false;
    screenView.style.display = 'none';
    screenView.srcObject = null;
    mainUi.style.display = 'none';
    loginForm.style.display = 'flex';
    connectBtn.disabled = false;
    muteBtn.textContent = 'Mute';
    muteBtn.classList.remove('muted');
    participantsEl.textContent = '';
  }

  connectBtn.onclick = connect;
  disconnectBtn.onclick = disconnect;
  muteBtn.onclick = toggleMute;
  secretInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') connect(); });
</script>

</body>
</html>
